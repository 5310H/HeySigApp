// Applied by both apps. No model/runtime downloads happen on an end-user device.
import java.security.MessageDigest
import groovy.json.JsonSlurper

def environmentIntegrity = new JsonSlurper().parse(rootProject.file('third_party/litert/integrity.json'))
def digest = { File file -> MessageDigest.getInstance('SHA-256').digest(file.bytes).encodeHex().toString() }
def verifyEnvironmentModel = tasks.register('verifyEnvironmentModel') {
    inputs.file(rootProject.file('audioAndroid/src/main/assets/environment/yamnet.tflite'))
    inputs.file(rootProject.file('audioAndroid/src/main/assets/environment/labels.txt'))
    inputs.file(rootProject.file('audioAndroid/src/main/assets/environment/scene-head.bin'))
    inputs.file(rootProject.file('audioAndroid/src/main/assets/environment/small-group-head.bin'))
    inputs.file(rootProject.file('audioAndroid/src/main/assets/environment/HEAD_NOTICE'))
    inputs.file(rootProject.file('audioAndroid/src/main/assets/environment/NOTICE'))
    inputs.file(rootProject.file('third_party/litert/integrity.json'))
    doLast {
        assert digest(rootProject.file('audioAndroid/src/main/assets/environment/yamnet.tflite')) ==
            'b2fc8fc3ff9c960bde60b5fea71335d4cb2a35c4d1b011c3a80927fd64d8a2e4': 'Unexpected YAMNet encoder'
        assert digest(rootProject.file('audioAndroid/src/main/assets/environment/scene-head.bin')) ==
            '0500150700fc75a8fc4b4c59f0cd284fea0b8d61d9b5fe6de074b24358233bfd': 'Unexpected environment scene head'
        assert digest(rootProject.file('audioAndroid/src/main/assets/environment/small-group-head.bin')) ==
            'b32f1124b31e4961f52c1153fa8220d3cc10b374292dfdb199b7bcb852e56be8': 'Unexpected Small Group scene head'
        assert digest(rootProject.file('audioAndroid/src/main/assets/environment/HEAD_NOTICE')) ==
            '05ae0943f40d8858a9f9e33385084054fc4ad3263cc297ee2c57ec2dad10eb8b': 'Unexpected scene source attribution'
        assert digest(rootProject.file('audioAndroid/src/main/assets/environment/NOTICE')) ==
            'e237d4cee44da23a7ac5297a86765f8bc9e00b528bec16920f0066df98f1fcc2': 'Unexpected monitoring profile notice'
        assert digest(rootProject.file('audioAndroid/src/main/assets/environment/labels.txt')) ==
            '8e1267a120c1932b7273c0d0e0c5529edbb9a35512b437b1c8982baa59047051': 'Unexpected YAMNet labels'
        ['debugRuntimeClasspath','releaseRuntimeClasspath'].each { configuration ->
            def artifacts = configurations.getByName(configuration).resolvedConfiguration.resolvedArtifacts.findAll {
                it.moduleVersion.id.group == 'com.google.ai.edge.litert'
            }
            assert artifacts.collect { it.file.name }.toSet() == environmentIntegrity.artifacts.keySet(): 'Unexpected LiteRT artifacts'
            artifacts.each { assert digest(it.file) == environmentIntegrity.artifacts[it.file.name]: 'Unexpected LiteRT artifact bytes' }
        }
    }
}
tasks.named('preBuild') { dependsOn(verifyEnvironmentModel) }
