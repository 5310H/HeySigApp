name: Phone and watch checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  development:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/**', 'gradle.properties') }}
          restore-keys: android-${{ runner.os }}-
      - name: Install pinned build tools and Kotlin compiler
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools' 'emulator' 'system-images;android-36;google_apis;x86_64'
          curl --fail --location --retry 3 https://github.com/JetBrains/kotlin/releases/download/v2.2.10/kotlin-compiler-2.2.10.zip -o "$RUNNER_TEMP/kotlin.zip"
          echo "302d1d8e671e5c3207e6ed62ff11fb555462a628e22a1158254dcaaf7e7394bc  $RUNNER_TEMP/kotlin.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/kotlin.zip" -d "$RUNNER_TEMP/kotlin"
          echo "$RUNNER_TEMP/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Create disposable CI signer (never an installed-device or release key)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p private/signing
          keytool -genkeypair -keystore private/signing/androidApp-debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=Disposable CI Development'
          cp private/signing/androidApp-debug.keystore private/signing/wearApp-debug.keystore
      - name: Shared policy checks
        run: |
          bash tools/check-noise.sh
          bash tools/check-manual.sh
          bash tools/check-sleep.sh
      - name: Build and lint both apps and device test packages
        run: >-
          ./gradlew --no-daemon --stacktrace
          -Dorg.gradle.jvmargs='-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8'
          :shared:test
          :androidApp:assembleDebug :androidApp:assembleDebugAndroidTest
          :wearApp:assembleDebug :wearApp:assembleDebugAndroidTest
          :androidApp:lintDebug :wearApp:lintDebug
      - name: Validate APK contents and native library pins/alignment
        run: |
          python3 tools/check-development-apk.py androidApp/build/outputs/apk/debug/androidApp-debug.apk
          python3 tools/validate-native-apks.py --variants debug
      - name: Run API 36 emulator smoke checks (silent transport)
        shell: bash
        run: |
          set -euo pipefail
          sudo chmod 666 /dev/kvm
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name heysig-ci --package 'system-images;android-36;google_apis;x86_64'
          "$ANDROID_HOME/emulator/emulator" -avd heysig-ci -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          timeout 240 bash -c 'until adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | grep -q 1; do sleep 3; done'
          adb -s emulator-5554 shell input keyevent 82
          python3 tools/run-device-smoke.py --device emulator-5554 --report ci-results/emulator-smoke.txt
      - name: Record exact source and APK hashes
        if: always()
        run: |
          mkdir -p ci-results
          git show -s --format=fuller HEAD > ci-results/source.txt
          find androidApp/build/outputs/apk wearApp/build/outputs/apk -name '*.apk' -type f -exec sha256sum {} + > ci-results/apk-sha256.txt
          echo 'Development artifacts only. Disposable CI signer; re-sign locally before any in-place device update. No Play approval or physical acceptance implied.' > ci-results/README.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: development-checks-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            ci-results/
            androidApp/build/outputs/apk/
            wearApp/build/outputs/apk/
            androidApp/build/reports/lint-results-debug.*
            wearApp/build/reports/lint-results-debug.*
            shared/build/reports/tests/
            shared/build/test-results/
